<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Progress</title></head>

-valuetext="75%" role="progressbar" data-state="loading" data-value="75" data-max="100" data-slot="progress" class="relative h-1 w-full overflow-hidden rounded-full bg-alpha-white-7" aria-label="warn"><div data-state="loading" data-value="75" data-max="100" data-slot="progress-indicator" class="k-progress-fill h-full w-full bg-(--signal-amber)" style="translate:-25% 0"></div></div><div aria-valuemax="100" aria-valuemin="0" aria-valuenow="95" aria-valuetext="95%" role="progressbar" data-state="loading" data-value="95" data-max="100" data-slot="progress" class="relative h-1 w-full overflow-hidden rounded-full bg-alpha-white-7" aria-label="danger"><div data-state="loading" data-value="95" data-max="100" data-slot="progress-indicator" class="k-progress-fill h-full w-full bg-danger" style="translate:-5% 0"></div></div></div></div><div class="gal-row"><span class="gal-cap">不确定</span><div class="gal-wide"><div aria-valuemax="100" aria-valuemin="0" role="progressbar" data-state="indeterminate" data-max="100" data-slot="progress" class="relative h-1 w-full overflow-hidden rounded-full bg-alpha-white-7" aria-label="不确定进度" data-testid="progress-indeterminate"><div data-state="indeterminate" data-max="100" data-slot="progress-indicator" class="k-progress-fill h-full w-full bg-brand"></div></div></div></div>
