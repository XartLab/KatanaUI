<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>RangeBar</title></head>
<body style="margin:0;padding:var(--space-4);background:var(--bg-100);color:var(--ink-200);font:var(--text-body) var(--font-sans);display:flex;flex-direction:column;gap:var(--space-3)">
<div class="gal-row"><span class="gal-cap">区间中的位置</span><div class="gal-wide" data-gallery-range="mid"><div class="k-range" role="meter" aria-label="示例当日区间" aria-valuemin="9.5" aria-valuemax="12.5" aria-valuenow="11.8" aria-valuetext="9.5 – 12.5: 11.8"><span class="k-range-end is-low"><small>最低</small>9.5</span><span class="k-range-track" aria-hidden="true"><span class="k-range-fill" style="width:76.6666666666667%"></span><span class="k-range-mark" style="left:76.6666666666667%"></span></span><span class="k-range-end is-high"><small>最高</small>12.5</span></div></div></div><div class="gal-row"><span class="gal-cap">贴边（现价在区间外）</span><div class="gal-wide" data-gallery-range="edge"><div class="k-range" role="meter" aria-label="示例越界" aria-valuemin="9.5" aria-valuemax="12.5" aria-valuenow="13" aria-valuetext="9.5 – 12.5: 13"><span class="k-range-end is-low">9.5</span><span class="k-range-track" aria-hidden="true"><span class="k-range-fill" style="width:100%"></span><span class="k-range-mark" style="left:100%"></span></span><span class="k-range-end is-high">12.5</span></div></div></div><div class="gal-row"><span class="gal-cap">最高等于最低（不画标记）</span><div class="gal-wide" data-gallery-range="none"><div class="k-range" role="meter" aria-label="示例无区间" aria-valuemin="10" aria-valuemax="10" aria-valuenow="10" aria-valuetext="10 – 10: 10"><span class="k-range-end is-low">10</span><span class="k-range-track" aria-hidden="true"></span><span class="k-range-end is-high">10</span></div></div></div><p class="gal-note">示例数据，不是行情。标记按弹簧滑到新位置。</p>

</body>
</html>
