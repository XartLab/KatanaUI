# SPDX-License-Identifier: MIT
# 文档站与 shadcn 注册表发布到 GitHub Pages（KATANAview #1881 起的做法；本仓库 2026-11-14 起是源头，#2）。
# 前提：仓库的 Settings → Pages → Source 选 GitHub Actions；私有仓库的 Pages 要付费套餐（用户 2026-10-26 定不付费），仓库公开后才会发出去。
# 站点地址 https://xartlab.github.io/KatanaUI/，注册表 https://xartlab.github.io/KatanaUI/r/{name}.json。
# Pages 三个动作的版本 2026-11-14 查过：configure-pages v5、upload-pages-artifact v5、deploy-pages v4。
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同时只发一个；正在发的不取消，让它发完，后面的排队（Pages 官方写法）。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      # 站点在 /KatanaUI/ 下；build:site 同时出文档站与 r/（shadcn 注册表）。
      - run: pnpm build:site
        env:
          SITE_BASE: /KatanaUI/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: packages/react/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
