# SPDX-License-Identifier: MIT
# PR 与 main 上的门禁（#2）：跟本地的 pnpm test、pnpm typecheck、pnpm build:site 一样。
# 全量门禁放在这里并行跑，本地平时只跑 pnpm fast（2026-11-18：本地全量约 20 分钟，太慢）。
# runner：仓库变量 KATANAUI_RUNNER（JSON，如 ["self-hosted","au-5090"]）指到自建机；没设就用 GitHub 托管的 ubuntu-latest。
# e2e 用 playwright --shard 切成 4 片并行（自建机核多可以切更细：改 e2e 的 matrix）。动作版本与 pages.yml 一致（2026-11-14 查过）。
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ${{ fromJSON(vars.KATANAUI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build:site

  # 组件截图（Vitest 浏览器模式 + pixelgate）：整套 444 张，基线在 packages/react/.pixelgate-unit/baseline/。
  shots:
    runs-on: ${{ fromJSON(vars.KATANAUI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: packages/react
      - run: pnpm exec vp test run -c vitest.browser.config.ts
        working-directory: packages/react
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pixelgate-unit
          path: |
            packages/react/.pixelgate-unit/
            !packages/react/.pixelgate-unit/baseline/
          include-hidden-files: true
          if-no-files-found: ignore

  # e2e：按切片并行（playwright --shard）。切片数改这里的 matrix。
  e2e:
    runs-on: ${{ fromJSON(vars.KATANAUI_RUNNER || '"ubuntu-latest"') }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: packages/react
      - run: pnpm exec playwright test --shard=${{ matrix.shard }}/4
        working-directory: packages/react
        env:
          E2E_PORT: 533${{ matrix.shard }}

  # 视觉回归（pixelgate，自研）：只在 PR 上跑——main 上的内容已经过 PR 这一关，不重复占 runner（本文件其余 job 两边都跑，这条是有意的例外）。
  # CI 不写基线、缺基线算失败（--ci）；基线是 Linux 渲染的，提交在 packages/react/.pixelgate/baseline/。
  visual:
    if: github.event_name == 'pull_request'
    runs-on: ${{ fromJSON(vars.KATANAUI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: packages/react
      - run: pnpm vr --ci
        working-directory: packages/react
      # 不管过没过都把摘要写进 job summary；没有报告（比如配置错误）就不写。
      - if: always()
        run: pnpm vr:summary >> "$GITHUB_STEP_SUMMARY" || true
        working-directory: packages/react
      # 失败时上传报告与这次的截图（接受时用：gh run download 之后 pnpm vr:approve --from <目录>）；基线不用传，仓库里就有。
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pixelgate
          path: |
            packages/react/.pixelgate/
            !packages/react/.pixelgate/baseline/
            !packages/react/.pixelgate/hidpi/baseline/
          include-hidden-files: true
          if-no-files-found: ignore
