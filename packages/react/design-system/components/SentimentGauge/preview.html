<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SentimentGauge</title></head>
<body style="margin:0;padding:var(--space-4);background:var(--bg-100);color:var(--ink-200);font:var(--text-body) var(--font-sans);display:flex;flex-direction:column;gap:var(--space-3)">
<p class="gal-note">示例数据：评分与口径由调用方给；取不到写「—」。</p><div class="gal-row"><div class="gal-wide" data-testid="sentiment" style="max-width:300px"><section class="k-sentiment" data-slot="sentiment-gauge" data-level="3" aria-label="情绪温度"><div class="k-sentiment-head"><b class="k-sentiment-score" data-slot="sentiment-score" role="img" aria-label="情绪温度 62，升温">62</b><span class="k-sentiment-caption">情绪分</span><span class="k-sentiment-level" data-slot="sentiment-level">升温</span></div><div class="k-sentiment-band" data-slot="sentiment-band" aria-hidden="true"><span class="k-sentiment-seg" data-seg="0"></span><span class="k-sentiment-seg" data-seg="1"></span><span class="k-sentiment-seg" data-seg="2"></span><span class="k-sentiment-seg" data-seg="3" data-current="true"></span><span class="k-sentiment-seg" data-seg="4"></span><i class="k-sentiment-marker" style="left:62%"></i></div><div class="k-sentiment-names" aria-hidden="true"><span>冰点</span><span>低迷</span><span>中性</span><span>升温</span><span>高潮</span></div><p class="k-sentiment-basis" data-slot="sentiment-basis">示例口径 · 规则评分 · 未历史校准</p><table class="k-sentiment-compare" data-slot="sentiment-compare"><thead><tr><td></td><th scope="col">今日</th><th scope="col">昨日</th></tr></thead><tbody><tr data-key="limitUp"><th scope="row">涨停</th><td data-col="today">30</td><td data-col="yesterday">23</td></tr><tr data-key="limitDown"><th scope="row">跌停</th><td data-col="today">62</td><td data-col="yesterday">68</td></tr><tr data-key="sealRate"><th scope="row">封率</th><td data-col="today">62.5%</td><td data-col="yesterday">48.0%</td></tr><tr data-key="broken"><th scope="row">开板</th><td data-col="today">10</td><td data-col="yesterday" data-unavailable="true" title="示例：昨日未记录">—</td></tr></tbody></table></section></div><div class="gal-wide" data-testid="sentiment-cold" style="max-width:300px"><section class="k-sentiment" data-slot="sentiment-gauge" data-level="0" aria-label="情绪温度"><div class="k-sentiment-head"><b class="k-sentiment-score" data-slot="sentiment-score" role="img" aria-label="情绪温度 12，冰点">12</b><span class="k-sentiment-caption">情绪分</span><span class="k-sentiment-level" data-slot="sentiment-level">冰点</span></div><div class="k-sentiment-band" data-slot="sentiment-band" aria-hidden="true"><span class="k-sentiment-seg" data-seg="0" data-current="true"></span><span class="k-sentiment-seg" data-seg="1"></span><span class="k-sentiment-seg" data-seg="2"></span><span class="k-sentiment-seg" data-seg="3"></span><span class="k-sentiment-seg" data-seg="4"></span><i class="k-sentiment-marker" style="left:12%"></i></div><div class="k-sentiment-names" aria-hidden="true"><span>冰点</span><span>低迷</span><span>中性</span><span>升温</span><span>高潮</span></div><p class="k-sentiment-basis" data-slot="sentiment-basis">示例口径</p></section></div><div class="gal-wide" data-testid="sentiment-none" style="max-width:300px"><section class="k-sentiment" data-slot="sentiment-gauge" aria-label="情绪温度"><div class="k-sentiment-head"><b class="k-sentiment-score" data-slot="sentiment-score" role="img" aria-label="情绪温度 —，—" title="示例：评分数据没到">—</b><span class="k-sentiment-caption">情绪分</span><span class="k-sentiment-level" data-slot="sentiment-level">—</span></div><div class="k-sentiment-band" data-slot="sentiment-band" aria-hidden="true"><span class="k-sentiment-seg" data-seg="0"></span><span class="k-sentiment-seg" data-seg="1"></span><span class="k-sentiment-seg" data-seg="2"></span><span class="k-sentiment-seg" data-seg="3"></span><span class="k-sentiment-seg" data-seg="4"></span></div><div class="k-sentiment-names" aria-hidden="true"><span>冰点</span><span>低迷</span><span>中性</span><span>升温</span><span>高潮</span></div></section></div></div>

</body>
</html>
