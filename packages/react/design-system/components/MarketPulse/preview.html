<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MarketPulse</title></head>
<body style="margin:0;padding:var(--space-4);background:var(--bg-100);color:var(--ink-200);font:var(--text-body) var(--font-sans);display:flex;flex-direction:column;gap:var(--space-3)">
<p class="gal-note">示例数据：占比由三个家数算出；取不到的读数写「—」，悬停看原因。</p><div class="gal-wide" data-testid="market-pulse" style="max-width:1180px"><div class="k-pulse" data-slot="market-pulse" role="group" aria-label="市场全景"><div class="k-pulse-dial" data-slot="pulse-dial"><svg viewBox="0 0 100 54" role="img" aria-label="上涨占比 5.4%"><path class="k-pulse-dial-track" d="M 10 50 A 40 40 0 0 1 90 50"></path><path class="k-pulse-dial-fill" d="M 10 50 A 40 40 0 0 1 10.58 43.22"></path></svg><b class="k-pulse-share">5.4%</b><span class="k-pulse-dial-caption">上涨占比</span></div><div class="k-pulse-main"><dl class="k-pulse-counts"><div class="k-pulse-count" data-slot="pulse-count" data-key="rising" data-tone="up"><dt>上涨</dt><dd>302<small>家</small></dd></div><div class="k-pulse-count" data-slot="pulse-count" data-key="falling" data-tone="down"><dt>下跌</dt><dd>5,239<small>家</small></dd></div><div class="k-pulse-count" data-slot="pulse-count" data-key="limitUp" data-tone="up"><dt>涨停</dt><dd>30<small>家</small></dd></div><div class="k-pulse-count" data-slot="pulse-count" data-key="limitDown" data-tone="down"><dt>跌停</dt><dd>62<small>家</small></dd></div><div class="k-pulse-count" data-slot="pulse-count" data-key="flat" data-tone="muted"><dt>平盘</dt><dd>31<small>家</small></dd></div></dl><div class="k-pulse-line" data-slot="pulse-line"><span class="k-pulse-read" data-slot="pulse-reading" data-key="nonStLimitUp"><span class="k-pulse-read-name">非ST涨停</span><b>28家</b></span><span class="k-pulse-read" data-slot="pulse-reading" data-key="broken"><span class="k-pulse-read-name">炸板</span><b>10家</b></span><span class="k-pulse-read" data-slot="pulse-reading" data-key="highestBoard"><span class="k-pulse-read-name">最高连板</span><b>4板</b></span><span class="k-pulse-read" data-slot="pulse-reading" data-key="limitUpAmount" data-unavailable="true" title="示例：日内未知"><span class="k-pulse-read-name">涨停板上成交额</span><b>—</b></span><span class="k-pulse-read" data-slot="pulse-reading" data-key="sealEstimate"><span class="k-pulse-read-name">涨停封单估算</span><b>22.83亿</b></span><span class="k-pulse-read" data-slot="pulse-reading" data-key="yesterday"><span class="k-pulse-read-name">昨日涨停 / 跌停 / 炸板</span><b><span>23</span><span> / 68</span><span> / 24</span></b><small class="k-pulse-basis">示例基准日</small></span></div><div class="k-pulse-line" data-slot="pulse-line"><span class="k-pulse-read" data-slot="pulse-reading" data-key="turnover" data-unavailable="true" title="示例：成交额还没给"><span class="k-pulse-read-name">两市成交额</span><b>—</b></span><span class="k-pulse-read" data-slot="pulse-reading" data-key="turnoverForecast" data-unavailable="true" title="暂无数据"><span class="k-pulse-read-name">预测成交</span><b>—</b></span><span class="k-pulse-read" data-slot="pulse-reading" data-key="mainNetInflow" data-unavailable="true" title="暂无数据"><span class="k-pulse-read-name">主力净流入</span><b>—</b></span></div></div><div class="k-pulse-dist" data-slot="pulse-distribution"><p class="k-pulse-dist-title">涨跌分布</p><div class="k-dist" data-slot="distribution-bars" role="group" aria-label="涨跌分布"><div class="k-dist-plot" style="height:52px"><div class="k-dist-col" data-slot="distribution-bin" data-key="b0" data-tone="down"><span class="k-dist-count">119</span><i class="k-dist-bar" style="height:2px"></i></div><div class="k-dist-col" data-slot="distribution-bin" data-key="b1" data-tone="down"><span class="k-dist-count">946</span><i class="k-dist-bar" style="height:19px"></i></div><div class="k-dist-col" data-slot="distribution-bin" data-key="b2" data-tone="down"><span class="k-dist-count">1,761</span><i class="k-dist-bar" style="height:36px"></i></div><div class="k-dist-col" data-slot="distribution-bin" data-key="b3" data-tone="down"><span class="k-dist-count">1,381</span><i class="k-dist-bar" style="height:28px"></i></div><div class="k-dist-col" data-slot="distribution-bin" data-key="b4" data-tone="down"><span class="k-dist-count">1,032</span><i class="k-dist-bar" style="height:21px"></i></div><div class="k-dist-col" data-slot="distribution-bin" data-key="b5" data-tone="muted"><span class="k-dist-count">31</span><i class="k-dist-bar" style="height:1px"></i></div><div class="k-dist-col" data-slot="distribution-bin" data-key="b6" data-tone="up"><span class="k-dist-count">211</span><i class="k-dist-bar" style="height:4px"></i></div><div class="k-dist-col" data-slot="distribution-bin" data-key="b7" data-tone="up"><span class="k-dist-count">37</span><i class="k-dist-bar" style="height:1px"></i></div><div class="k-dist-col" data-slot="distribution-bin" data-key="b8" data-tone="up"><span class="k-dist-count">8</span><i class="k-dist-bar" style="height:1px"></i></div><div class="k-dist-col" data-slot="distribution-bin" data-key="b9" data-tone="up"><span class="k-dist-count">28</span><i class="k-dist-bar" style="height:1px"></i></div><div class="k-dist-col" data-slot="distribution-bin" data-key="b10" data-tone="up"><span class="k-dist-count">18</span><i class="k-dist-bar" style="height:1px"></i></div></div><div class="k-dist-axis" aria-hidden="true"><span class="k-dist-label">&lt;-10</span><span class="k-dist-label">-10</span><span class="k-dist-label">-7</span><span class="k-dist-label">-5</span><span class="k-dist-label">-3</span><span class="k-dist-label">0</span><span class="k-dist-label">0+</span><span class="k-dist-label">3</span><span class="k-dist-label">5</span><span class="k-dist-label">7</span><span class="k-dist-label">&gt;10</span></div></div></div></div></div>

</body>
</html>
