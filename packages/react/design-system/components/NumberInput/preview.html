<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>NumberInput</title></head>
<body style="margin:0;padding:var(--space-4);background:var(--bg-100);color:var(--ink-200);font:var(--text-body) var(--font-sans);display:flex;flex-direction:column;gap:var(--space-3)">
<div class="gal-row"><span class="gal-cap">默认</span><span class="k-num" style="width:96px"><input role="spinbutton" inputMode="decimal" aria-label="线宽" aria-valuenow="14" aria-valuemin="1" aria-valuemax="40" aria-valuetext="14 px" value="14"/><span class="k-unit">px</span></span><output data-gallery-number="true">14</output></div><div class="gal-row"><span class="gal-cap">sm · 小数</span><span class="k-num sm" style="width:80px"><input role="spinbutton" inputMode="decimal" aria-label="步长" aria-valuenow="0.5" aria-valuemin="0" aria-valuemax="10" value="0.5"/></span></div><div class="gal-row"><span class="gal-cap">自动</span><span class="k-num" style="width:96px"><input role="spinbutton" inputMode="decimal" aria-label="根数" aria-valuenow="0" aria-valuemin="0" aria-valuemax="500" aria-valuetext="自动" value="自动"/></span></div><div class="gal-row"><span class="gal-cap">标签 · 算式</span><span class="k-num" style="width:140px"><span class="k-cap" aria-hidden="true">数量</span><input role="spinbutton" inputMode="decimal" aria-label="数量" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100000" value="100"/></span><output data-gallery-qty="true">100</output></div><div class="gal-row"><span class="gal-cap">禁用 · 非法</span><span class="k-num dis" style="width:96px"><input role="spinbutton" inputMode="decimal" aria-label="禁用" disabled="" aria-valuenow="3" value="3"/></span><span class="k-num err" style="width:96px"><input role="spinbutton" inputMode="decimal" aria-label="非法" aria-invalid="true" aria-valuenow="3" value="3"/></span></div><p class="gal-note">打字、↑↓、按住左右拖（Shift 粗调、Alt 精调）都能改值；越界夹进范围。「标签 · 算式」那个框还能写 +10%、*2、/4、100*1.5，回车算。</p>

</body>
</html>
