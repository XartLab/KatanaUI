<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Splitter</title></head>
<body style="margin:0;padding:var(--space-4);background:var(--bg-100);color:var(--ink-200);font:var(--text-body) var(--font-sans);display:flex;flex-direction:column;gap:var(--space-3)">
<div class="gal-stack" style="width:100%;max-width:560px"><p class="gal-note">拖动、方向键（8px，Shift 32px）、Home / End、双击或 Enter 复位到 50%；靠近 1/3、1/2、2/3 吸附。</p><div data-testid="splitter-demo" style="display:grid;grid-template-columns:minmax(0, 0.4fr) 8px minmax(0, 0.6fr);height:120px"><div style="background:var(--bg-200);min-width:0"><p class="gal-note" style="padding:8px">40%</p></div><div role="separator" tabindex="0" data-slot="splitter" data-axis="row" class="k-splitter" aria-label="Resize panes" aria-orientation="vertical" aria-valuemin="0" aria-valuemax="100" aria-valuenow="40" aria-valuetext="First pane 40%"><span class="k-splitter-grip"></span></div><div style="background:var(--bg-200);min-width:0"><p class="gal-note" style="padding:8px">60%</p></div></div></div>

</body>
</html>
