<div class="gal-row"><span class="gal-cap">一条（静态摆出）</span><div style="width:340px"><div data-slot="toast" data-phase="open" class="k-toast k-text-body rounded-[var(--radius-overlay)] border border-l-2 border-alpha-white-6 border-l-brand bg-surface-4 p-3 text-ink-2 shadow-[0_16px_48px_rgba(0,0,0,0.55),0_2px_8px_rgba(0,0,0,0.3)] data-[starting-style]:translate-y-2 data-[starting-style]:opacity-0 data-[ending-style]:translate-y-2 data-[ending-style]:opacity-0 group-data-[position^=top]/toasts:data-[starting-style]:-translate-y-2 group-data-[position^=top]/toasts:data-[ending-style]:-translate-y-2"><div data-slot="toast-content" class="flex items-start gap-3"><span data-slot="toast-icon" aria-hidden="true" class="mt-0.5 flex size-4 flex-none items-center justify-center text-(--signal-orange) [&amp;&gt;svg]:size-4"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-bell-ring" aria-hidden="true"><path d="M10.268 21a2 2 0 0 0 3.464 0"></path><path d="M22 8c0-2.3-.8-4.3-2-6"></path><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"></path><path d="M4 2C2.8 3.7 2 5.7 2 8"></path></svg></span><div data-slot="toast-text" class="flex min-w-0 flex-1 flex-col gap-1"><p data-slot="toast-title" class="k-text-body m-0 leading-4 font-semibold text-ink tabular-nums">BTCUSDT 上穿 106,000</p><p data-slot="toast-description" class="k-text-caption m-0 leading-[15px] [overflow-wrap:anywhere] text-ink-3 tabular-nums">价格穿越，触发价 106,012.4（示例）</p></div><button data-slot="toast-close" data-variant="icon" data-size="icon" type="button" class="inline-flex cursor-pointer items-center justify-center gap-(--k-spacing-100) whitespace-nowrap select-none k-text-data leading-none rounded-[var(--radius-control)] border-(color:--k-actionable-borderColor) ease-out disabled:cursor-not-allowed [&amp;_svg]:pointer-events-none [&amp;_svg]:shrink-0 outline-0 focus-visible:outline-(length:--k-focused-outlineWidth) focus-visible:outline-(color:--k-focused-outlineColor) border-0 bg-transparent text-(color:--k-actionable-subtle-foreground) transition-[color,background-color] duration-[120ms] not-disabled:hover:bg-(--k-actionable-subtle-background-hover) not-disabled:hover:text-(color:--k-actionable-subtle-foreground-hover) not-disabled:active:scale-100 not-disabled:active:bg-(--k-actionable-subtle-background-active) disabled:opacity-35 focus-visible:-outline-offset-2 [&amp;_svg]:size-[15px] size-(--k-size-row) p-0 flex-none" aria-label="关掉这条提示"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button></div></div></div></div><div class="gal-row"><span class="gal-cap">弹出</span><button data-slot="button" data-variant="default" data-size="default" type="button" class="inline-flex shrink-0 cursor-pointer items-center justify-center gap-(--k-spacing-100) whitespace-nowrap select-none k-text-data leading-none rounded-[var(--radius-control)] border border-(color:--k-actionable-borderColor) bg-(--k-actionable-background) text-(color:--k-actionable-foreground) transition-[color,background-color,border-color,scale] duration-150 ease-out not-disabled:hover:bg-(--k-actionable-background-hover) not-disabled:hover:text-(color:--k-actionable-foreground-hover) not-disabled:active:scale-[0.97] not-disabled:active:bg-(--k-actionable-background-active) disabled:cursor-not-allowed disabled:opacity-45 [&amp;_svg]:pointer-events-none [&amp;_svg]:size-[13px] [&amp;_svg]:shrink-0 outline-0 focus-visible:outline-(length:--k-focused-outlineWidth) focus-visible:outline-offset-(--k-focused-outlineOffset) focus-visible:outline-(color:--k-focused-outlineColor) h-(--k-size-base) px-(--k-spacing-200)">弹一条提示</button><p class="gal-note">提示叠在窗口右下角；两条以上多出「全部关掉」。收起走过渡，播完才摘节点。</p></div><div role="region" aria-live="assertive" aria-atomic="false" aria-relevant="additions" data-slot="toast-viewport" data-position="bottom-right" class="group/toasts k-toasts fixed z-60 flex w-[min(340px,calc(100vw-32px))] gap-2 outline-0 bottom-4 flex-col-reverse right-4" aria-label="演示提示" data-testid="toast-viewport"></div>
