<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SymbolSearch</title></head>
<body style="margin:0;padding:var(--space-4);background:var(--bg-100);color:var(--ink-200);font:var(--text-body) var(--font-sans);display:flex;flex-direction:column;gap:var(--space-3)">
<div class="gal-stack" style="width:100%;max-width:640px"><div tabindex="0" role="group" aria-label="演示图表：在这里直接打字打开品种搜索" data-testid="symbol-search-area" class="outline-0 focus-visible:outline-(length:--k-focused-outlineWidth) focus-visible:outline-offset-(--k-focused-outlineOffset) focus-visible:outline-(color:--k-focused-outlineColor)" style="height:180px;display:flex;align-items:center;justify-content:center;border-radius:10px;border:1px solid var(--k-separable-subtle-borderColor);background:var(--k-surface-sunken-background)"><span class="k-text-data" style="color:var(--k-content-secondary-foreground)">点一下这里，再直接打字（比如 a、btc、600）</span></div><p class="gal-note" data-testid="symbol-search-picked">还没有选品种</p><p class="gal-note">演示数据：代码、名称、交易所都是写死的，不是行情；搜索故意延迟 150ms。</p></div>

</body>
</html>
