<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AgentLanes</title></head>
<body style="margin:0;padding:var(--space-4);background:var(--bg-100);color:var(--ink-200);font:var(--text-body) var(--font-sans);display:flex;flex-direction:column;gap:var(--space-3)">
<p class="gal-note">示例数据：研究员读完研报交给风控（竖线），风控的块在等你。点等人的块弹出「批准」「拒绝」；没给回调时件自己改状态，只为演示。</p><div class="gal-row"><span class="gal-cap">三个 Agent</span><div class="gal-wide" style="max-width:760px" data-gallery-al="main"><section class="k-al" data-slot="agent-lanes"><header class="k-al-head"><h4 class="k-al-title">Agent（示例）</h4><span class="k-al-attention" aria-live="polite" data-slot="lanes-attention">1 个块等你</span></header><div class="k-al-board" style="grid-template-rows:20px repeat(3, 40px)"><span class="k-al-axis" aria-hidden="true"><i data-align="start">0 分</i><i data-align="mid">15 分</i><i data-align="end">30 分</i></span><div class="k-al-lane" style="grid-row:2" data-slot="lanes-lane" data-tag="busy"><span class="k-al-who"><span class="k-al-avatar" aria-hidden="true">研</span><span class="k-al-name"><span>研究员</span><small>model-a</small></span></span><ul class="k-al-track" aria-label="研究员"><li class="k-al-slot" style="left:6.667%;width:max(6px, 33.333%)"><button type="button" class="k-al-block" data-slot="lanes-block" data-id="t1" data-status="done" aria-label="研究员，读研报，完成，2 分–12 分" id="ui-sdk-_R_6da_-trigger" aria-haspopup="dialog" aria-expanded="false" data-closed="" data-state="closed"><span>读研报</span></button></li><li class="k-al-slot" style="left:60.000%;width:max(6px, 40.000%)"><button type="button" class="k-al-block" data-slot="lanes-block" data-id="t3" data-status="running" aria-label="研究员，查资金流，在跑，18 分–30 分" id="ui-sdk-_R_ada_-trigger" aria-haspopup="dialog" aria-expanded="false" data-closed="" data-state="closed"><span>查资金流</span></button></li></ul></div><div class="k-al-lane" style="grid-row:3" data-slot="lanes-lane" data-tag="needs"><span class="k-al-who"><span class="k-al-avatar" aria-hidden="true">风</span><span class="k-al-name"><span>风控</span><small>model-b</small></span><small class="k-al-tag">要你</small></span><ul class="k-al-track" aria-label="风控"><li class="k-al-slot" style="left:40.000%;width:max(6px, 60.000%)"><button type="button" class="k-al-block" data-slot="lanes-block" data-id="t2" data-status="waiting" aria-label="风控，算敞口，等你，12 分–30 分" id="ui-sdk-_R_6la_-trigger" aria-haspopup="dialog" aria-expanded="false" data-closed="" data-state="closed"><span>算敞口</span></button></li></ul></div><div class="k-al-lane" style="grid-row:4" data-slot="lanes-lane" data-tag="idle"><span class="k-al-who"><span class="k-al-avatar" aria-hidden="true">撰</span><span class="k-al-name"><span>撰稿</span><small>model-a</small></span><small class="k-al-tag">空闲</small></span><ul class="k-al-track" aria-label="撰稿"><li class="k-al-slot" style="left:20.000%;width:max(6px, 10.000%)"><button type="button" class="k-al-block" data-slot="lanes-block" data-id="t4" data-status="failed" aria-label="撰稿，盘中简报，失败，6 分–9 分" id="ui-sdk-_R_6ta_-trigger" aria-haspopup="dialog" aria-expanded="false" data-closed="" data-state="closed"><span>盘中简报</span></button></li></ul></div><svg class="k-al-links" style="grid-row:2 / 5" viewBox="0 0 100 30" preserveAspectRatio="none" aria-hidden="true"><g data-slot="lanes-handoff"><line x1="40" x2="40" y1="5" y2="15"></line><circle cx="40" cy="15" r="0.8"></circle></g></svg></div></section></div></div>

</body>
</html>
