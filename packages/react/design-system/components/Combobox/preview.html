<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Combobox</title></head>
<body style="margin:0;padding:var(--space-4);background:var(--bg-100);color:var(--ink-200);font:var(--text-body) var(--font-sans);display:flex;flex-direction:column;gap:var(--space-3)">
<div class="gal-row"><span class="gal-cap">单选（选了收起）</span><button type="button" aria-haspopup="listbox" aria-expanded="false" data-state="closed" data-slot="combobox-trigger" role="combobox" class="k-text-data box-border inline-flex h-[30px] min-w-[120px] cursor-pointer items-center justify-between gap-1.5 rounded-[var(--radius-control)] border border-alpha-white-8 bg-alpha-white-1 px-2 leading-none whitespace-nowrap text-ink transition-[background-color] duration-[120ms] disabled:cursor-not-allowed disabled:opacity-45 [&amp;_[data-slot=select-icon]]:transition-transform [&amp;_[data-slot=select-icon]]:duration-150 data-[state=open]:[&amp;_[data-slot=select-icon]]:rotate-180 outline-0 focus-visible:outline-(length:--k-focused-outlineWidth) focus-visible:outline-offset-(--k-focused-outlineOffset) focus-visible:outline-(color:--k-focused-outlineColor)" aria-label="周期" style="width:160px"><span>1 小时</span><span data-slot="select-icon" class="inline-flex text-ink-3"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-down size-[10px]" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></span></button><output data-testid="combobox-value">1h</output></div><div class="gal-row"><span class="gal-cap">多选（不收）</span><button type="button" aria-haspopup="listbox" aria-expanded="false" data-state="closed" data-slot="combobox-trigger" role="combobox" class="k-text-data box-border inline-flex h-[30px] min-w-[120px] cursor-pointer items-center justify-between gap-1.5 rounded-[var(--radius-control)] border border-alpha-white-8 bg-alpha-white-1 px-2 leading-none whitespace-nowrap text-ink transition-[background-color] duration-[120ms] disabled:cursor-not-allowed disabled:opacity-45 [&amp;_[data-slot=select-icon]]:transition-transform [&amp;_[data-slot=select-icon]]:duration-150 data-[state=open]:[&amp;_[data-slot=select-icon]]:rotate-180 outline-0 focus-visible:outline-(length:--k-focused-outlineWidth) focus-visible:outline-offset-(--k-focused-outlineOffset) focus-visible:outline-(color:--k-focused-outlineColor)" aria-label="常用周期" style="width:160px"><span>已选 1 个</span><span data-slot="select-icon" class="inline-flex text-ink-3"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-down size-[10px]" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></span></button></div>
