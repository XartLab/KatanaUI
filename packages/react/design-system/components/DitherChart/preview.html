<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>DitherChart</title></head>
<body style="margin:0;padding:var(--space-4);background:var(--bg-100);color:var(--ink-200);font:var(--text-body) var(--font-sans);display:flex;flex-direction:column;gap:var(--space-3)">
<div class="gal-row"><span class="gal-cap">line</span><figure data-slot="dither-chart" data-variant="line" class="m-0 inline-flex flex-col gap-(--space-2) text-ink"><canvas aria-hidden="true" tabindex="-1" class="block" style="width:220px;height:120px" width="220" height="120"></canvas><span class="sr-only">净值走势：十个点从 3 升到 14</span></figure><figure data-slot="dither-chart" data-variant="bar" class="m-0 inline-flex flex-col gap-(--space-2) text-ink"><canvas aria-hidden="true" tabindex="-1" class="block" style="width:220px;height:120px" width="220" height="120"></canvas><span class="sr-only">两组柱：本周与上周的六日成交</span></figure></div><div class="gal-row"><span class="gal-cap">donut / gauge</span><figure data-slot="dither-chart" data-variant="donut" class="m-0 inline-flex flex-col gap-(--space-2) text-ink"><canvas aria-hidden="true" tabindex="-1" class="block" style="width:120px;height:120px" width="120" height="120"></canvas><span class="sr-only">仓位构成：46%、28%、16%、10%</span></figure><figure data-slot="dither-chart" data-variant="gauge" class="m-0 inline-flex flex-col gap-(--space-2) text-ink"><canvas aria-hidden="true" tabindex="-1" class="block" style="width:120px;height:120px" width="120" height="120"></canvas><span class="sr-only">风险使用率 72%</span></figure><figure data-slot="dither-chart" data-variant="funnel" class="m-0 inline-flex flex-col gap-(--space-2) text-ink"><canvas aria-hidden="true" tabindex="-1" class="block" style="width:160px;height:120px" width="160" height="120"></canvas><span class="sr-only">漏斗：信号到成交逐级转化</span></figure></div><div class="gal-row"><span class="gal-cap">heatmap</span><figure data-slot="dither-chart" data-variant="heatmap" class="m-0 inline-flex flex-col gap-(--space-2) text-ink"><canvas aria-hidden="true" tabindex="-1" class="block" style="width:220px;height:90px" width="220" height="90"></canvas><span class="sr-only">三个板块八个时段的热度</span></figure><figure data-slot="dither-chart" data-variant="stacked" class="m-0 inline-flex flex-col gap-(--space-2) text-ink"><canvas aria-hidden="true" tabindex="-1" class="block" style="width:160px;height:90px" width="160" height="90"></canvas><span class="sr-only">两组堆叠柱</span></figure></div>

</body>
</html>
