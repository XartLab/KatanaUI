<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TiltCard</title></head>
<body style="margin:0;padding:var(--space-4);background:var(--bg-100);color:var(--ink-200);font:var(--text-body) var(--font-sans);display:flex;flex-direction:column;gap:var(--space-3)">
<div class="gal-row"><div style="perspective:900px" class="inline-block"><div data-slot="tilt-card" class="relative overflow-hidden rounded-[var(--radius-overlay)] border border-alpha-white-6 bg-surface-3" style="transform-style:preserve-3d;transform:none"><div style="padding:24px;width:220px"><div data-tilt-depth="0.6" style="font-weight:600">策略实验室</div><div data-tilt-depth="0.2" style="opacity:0.7;margin-top:6px">写、测、比较，一处完成。</div></div><div aria-hidden="true" class="pointer-events-none absolute inset-0" style="background:radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--ink-100) %, transparent), transparent 60%)"></div></div></div><div style="perspective:900px" class="inline-block"><div data-slot="tilt-card" class="relative overflow-hidden rounded-[var(--radius-overlay)] border border-alpha-white-6 bg-surface-3" style="transform-style:preserve-3d;transform:none"><div style="padding:24px;width:220px"><div data-tilt-depth="0.8" style="font-weight:600">带视差</div></div></div></div></div><p class="gal-note" style="margin:0">适用：首页、营销页的功能卡；行情与下单区的东西要稳，不进交易主界面。</p>

</body>
</html>
