<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ScrollArea</title></head>
<body style="margin:0;padding:var(--space-4);background:var(--bg-100);color:var(--ink-200);font:var(--text-body) var(--font-sans);display:flex;flex-direction:column;gap:var(--space-3)">
<div class="gal-row"><span class="gal-cap">竖向</span><div data-slot="scroll-area" class="relative overflow-hidden" style="height:120px;width:220px;border:1px solid var(--line-100);border-radius:6px;position:relative" data-testid="scroll-area"><div data-slot="scroll-area-viewport" tabindex="0" class="size-full rounded-[inherit] outline-0 focus-visible:outline-(length:--k-focused-outlineWidth) focus-visible:-outline-offset-2 focus-visible:outline-(color:--k-focused-outlineColor)" style="overflow:auto;scrollbar-width:none"><div style="padding:8px"><div style="height:24px">第 1 行</div><div style="height:24px">第 2 行</div><div style="height:24px">第 3 行</div><div style="height:24px">第 4 行</div><div style="height:24px">第 5 行</div><div style="height:24px">第 6 行</div><div style="height:24px">第 7 行</div><div style="height:24px">第 8 行</div><div style="height:24px">第 9 行</div><div style="height:24px">第 10 行</div><div style="height:24px">第 11 行</div><div style="height:24px">第 12 行</div><div style="height:24px">第 13 行</div><div style="height:24px">第 14 行</div><div style="height:24px">第 15 行</div><div style="height:24px">第 16 行</div><div style="height:24px">第 17 行</div><div style="height:24px">第 18 行</div><div style="height:24px">第 19 行</div><div style="height:24px">第 20 行</div><div style="height:24px">第 21 行</div><div style="height:24px">第 22 行</div><div style="height:24px">第 23 行</div><div style="height:24px">第 24 行</div><div style="height:24px">第 25 行</div><div style="height:24px">第 26 行</div><div style="height:24px">第 27 行</div><div style="height:24px">第 28 行</div><div style="height:24px">第 29 行</div><div style="height:24px">第 30 行</div></div></div><div class="flex touch-none select-none h-full w-1" data-slot="scroll-area-scrollbar" aria-hidden="true" data-orientation="vertical" style="position:absolute;touch-action:none;user-select:none;-webkit-user-select:none;top:0;bottom:var(--scroll-area-corner-height,0px);inset-inline-end:0;display:none"><div data-slot="scroll-area-thumb" class="relative flex-1 rounded-[var(--radius-sm)] bg-(--k-content-primary-foreground)/18 transition-colors duration-100 hover:bg-(--k-content-primary-foreground)/32" data-orientation="vertical" style="height:var(--scroll-area-thumb-height);transform:translate3d(0,var(--scroll-area-thumb-offset,0px),0);display:none"></div></div><div class="flex touch-none select-none h-1 flex-col" data-slot="scroll-area-scrollbar" aria-hidden="true" data-orientation="horizontal" style="position:absolute;touch-action:none;user-select:none;-webkit-user-select:none;bottom:0;inset-inline-start:0;inset-inline-end:var(--scroll-area-corner-width,0px);display:none"><div data-slot="scroll-area-thumb" class="relative flex-1 rounded-[var(--radius-sm)] bg-(--k-content-primary-foreground)/18 transition-colors duration-100 hover:bg-(--k-content-primary-foreground)/32" data-orientation="horizontal" style="width:var(--scroll-area-thumb-width);transform:translate3d(var(--scroll-area-thumb-offset,0px),0,0);display:none"></div></div><div data-slot="scroll-area-corner" aria-hidden="true" style="position:absolute;bottom:0;inset-inline-end:0;width:var(--scroll-area-corner-width);height:var(--scroll-area-corner-height);display:none"></div></div></div><p class="gal-note">滚动条 4px，平时不出现，指到这一块才出一条淡线。Tab 聚焦后方向键、PageDown 也能滚。</p>

</body>
</html>
