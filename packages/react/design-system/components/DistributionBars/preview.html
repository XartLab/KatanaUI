<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>DistributionBars</title></head>
<body style="margin:0;padding:var(--space-4);background:var(--bg-100);color:var(--ink-200);font:var(--text-body) var(--font-sans);display:flex;flex-direction:column;gap:var(--space-3)">
<div class="gal-wide" data-testid="dist-bars" style="max-width:560px"><div class="k-dist" data-slot="distribution-bars" role="group" aria-label="示例涨跌幅分布"><div class="k-dist-plot" style="height:96px"><div class="k-dist-col" data-slot="distribution-bin" data-key="d0" data-tone="down"><span class="k-dist-count">38</span><i class="k-dist-bar" style="height:3px"></i></div><div class="k-dist-col" data-slot="distribution-bin" data-key="d1" data-tone="down"><span class="k-dist-count">120</span><i class="k-dist-bar" style="height:8px"></i></div><div class="k-dist-col" data-slot="distribution-bin" data-key="d2" data-tone="down"><span class="k-dist-count">210</span><i class="k-dist-bar" style="height:14px"></i></div><div class="k-dist-col" data-slot="distribution-bin" data-key="d3" data-tone="down"><span class="k-dist-count">480</span><i class="k-dist-bar" style="height:33px"></i></div><div class="k-dist-col" data-slot="distribution-bin" data-key="d4" data-tone="down"><span class="k-dist-count">920</span><i class="k-dist-bar" style="height:62px"></i></div><div class="k-dist-col" data-slot="distribution-bin" data-key="d5" data-tone="muted"><span class="k-dist-count">260</span><i class="k-dist-bar" style="height:18px"></i></div><div class="k-dist-col" data-slot="distribution-bin" data-key="d6" data-tone="up"><span class="k-dist-count">1,180</span><i class="k-dist-bar" style="height:80px"></i></div><div class="k-dist-col" data-slot="distribution-bin" data-key="d7" data-tone="up"><span class="k-dist-count">640</span><i class="k-dist-bar" style="height:43px"></i></div><div class="k-dist-col" data-slot="distribution-bin" data-key="d8" data-tone="up"><span class="k-dist-count">310</span><i class="k-dist-bar" style="height:21px"></i></div><div class="k-dist-col" data-slot="distribution-bin" data-key="d9" data-tone="up"><span class="k-dist-count">140</span><i class="k-dist-bar" style="height:9px"></i></div><div class="k-dist-col" data-slot="distribution-bin" data-key="d10" data-tone="up"><span class="k-dist-count">62</span><i class="k-dist-bar" style="height:4px"></i></div></div><div class="k-dist-axis" aria-hidden="true"><span class="k-dist-label">跌停</span><span class="k-dist-label">&lt;-7%</span><span class="k-dist-label">-7~-5</span><span class="k-dist-label">-5~-3</span><span class="k-dist-label">-3~-1</span><span class="k-dist-label">平</span><span class="k-dist-label">1~3</span><span class="k-dist-label">3~5</span><span class="k-dist-label">5~7</span><span class="k-dist-label">&gt;7%</span><span class="k-dist-label">涨停</span></div><p class="k-dist-totals" data-slot="distribution-totals"><span data-tone="up">涨 <b>2,332</b></span><span data-tone="muted">平 <b>260</b></span><span data-tone="down">跌 <b>1,768</b></span></p></div></div><p class="gal-note">示例数据：11 档（9 档同理），柱顶是家数，底部一行汇总；档的边界与文字都由调用方传。没有数据显示空态：</p><div class="gal-wide" data-testid="dist-empty" style="max-width:560px"><div class="k-dist" data-slot="distribution-bars" data-empty="true" aria-label="示例空态" role="group"><p class="k-dist-empty">暂无数据</p></div></div>

</body>
</html>
