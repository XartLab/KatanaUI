<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>KeyStats</title></head>
<body style="margin:0;padding:var(--space-4);background:var(--bg-100);color:var(--ink-200);font:var(--text-body) var(--font-sans);display:flex;flex-direction:column;gap:var(--space-3)">
<div class="gal-row"><span class="gal-cap">三列</span><div class="gal-wide" data-gallery-keystats="true" style="max-width:560px"><section class="k-keystats" data-slot="key-stats" aria-label="Key stats"><h3 class="k-keystats-title"><button type="button">Key stats<span class="k-keystats-chev" aria-hidden="true">›</span></button></h3><dl class="k-keystats-grid" style="grid-template-columns:repeat(3, minmax(0, 1fr))"><div class="k-keystats-item" data-slot="key-stat" data-key="cap"><dt><button type="button">Market cap<span class="k-keystats-chev" aria-hidden="true">›</span></button></dt><dd><span class="k-keystats-value">3.41T</span><small>USD</small><span class="k-keystats-badge">Mega cap</span></dd></div><div class="k-keystats-item" data-slot="key-stat" data-key="pe"><dt><button type="button">Price to earnings (P/E TTM)<span class="k-keystats-chev" aria-hidden="true">›</span></button></dt><dd><span class="k-keystats-value">31.20</span></dd></div><div class="k-keystats-item" data-slot="key-stat" data-key="eps"><dt><button type="button">Basic EPS (TTM)<span class="k-keystats-chev" aria-hidden="true">›</span></button></dt><dd><span class="k-keystats-value">6.57</span><small>USD</small></dd></div><div class="k-keystats-item" data-slot="key-stat" data-key="rev"><dt><button type="button">Revenue (FY)<span class="k-keystats-chev" aria-hidden="true">›</span></button></dt><dd><span class="k-keystats-value">391.04B</span><small>USD</small></dd></div><div class="k-keystats-item" data-slot="key-stat" data-key="div"><dt><button type="button">Dividend yield (indicated)<span class="k-keystats-chev" aria-hidden="true">›</span></button></dt><dd><span class="k-keystats-value">0.44</span><small>%</small></dd></div><div class="k-keystats-item" data-slot="key-stat" data-key="beta"><dt><button type="button">Beta (1Y)<span class="k-keystats-chev" aria-hidden="true">›</span></button></dt><dd><span class="k-keystats-value">—</span></dd></div></dl></section></div><output data-gallery-picked="true"></output></div><p class="gal-note">演示数据，不是行情。徽标是中性灰胶囊；没有值写「—」。</p>

</body>
</html>
