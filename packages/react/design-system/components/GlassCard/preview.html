<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>GlassCard</title></head>
<body style="margin:0;padding:var(--space-4);background:var(--bg-100);color:var(--ink-200);font:var(--text-body) var(--font-sans);display:flex;flex-direction:column;gap:var(--space-3)">
<div style="padding:28px;border-radius:12px;background:linear-gradient(135deg, var(--signal-orange-dim), var(--bg-400) 60%, var(--signal-blue))"><div data-slot="glass-card" class="relative isolate overflow-hidden gal-wide" style="border-radius:20px;background:var(--alpha-white-6);backdrop-filter:blur(11px) saturate(1.4);-webkit-backdrop-filter:blur(11px) saturate(1.4);box-shadow:inset 0 1px 0 var(--alpha-white-12), inset 0 0 0 1px var(--alpha-white-6), 0 26px 60px -26px color-mix(in srgb, var(--bg-000) 60%, transparent)"><span aria-hidden="true" class="pointer-events-none absolute inset-0" style="background:linear-gradient(125deg, color-mix(in oklab, var(--signal-blue) 40%, transparent) 0%, transparent 36%, transparent 64%, color-mix(in oklab, var(--signal-red) 34%, transparent) 100%);border-radius:20px"></span><div class="relative z-10 p-5">一个工作台装下回测、因子与新闻快讯。移动指针看高光。</div></div></div><p class="gal-note" style="margin:0">适用：压在图片或渐变上的首页、营销页卡片；压在纯色底上没有意义，不进交易主界面。</p>

</body>
</html>
