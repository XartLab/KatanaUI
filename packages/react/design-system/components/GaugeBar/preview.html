<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>GaugeBar</title></head>
<body style="margin:0;padding:var(--space-4);background:var(--bg-100);color:var(--ink-200);font:var(--text-body) var(--font-sans);display:flex;flex-direction:column;gap:var(--space-3)">
<div class="gal-row"><span class="gal-cap">有位置、有档位词</span><div class="gal-wide" data-gallery-gauge="ok"><figure class="k-gauge"><figcaption class="k-gauge-head"><span class="k-gauge-label">示例比率</span><span class="k-gauge-value">72.00%</span>偏热</figcaption><div class="k-gauge-track" aria-hidden="true"><span class="k-gauge-fill" style="width:72%"></span></div><p class="k-gauge-note">示例：甲数 / (甲数 + 乙数)</p></figure></div></div><div class="gal-row"><span class="gal-cap">取不到</span><div class="gal-wide" data-gallery-gauge="missing"><figure class="k-gauge"><figcaption class="k-gauge-head"><span class="k-gauge-label">示例比率</span><span class="k-gauge-value is-unavailable">还没有数据</span></figcaption><div class="k-gauge-track" aria-hidden="true"></div></figure></div></div><p class="gal-note">示例数据，不是行情。share 越界按边画；null 不画填充。</p>

</body>
</html>
