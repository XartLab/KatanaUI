<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>GaugeBar</title></head>
<body style="margin:0;padding:var(--space-4);background:var(--bg-100);color:var(--ink-200);font:var(--text-body) var(--font-sans);display:flex;flex-direction:column;gap:var(--space-3)">
<div class="gal-row"><span class="gal-cap">有位置、有档位词</span><div class="gal-wide" data-gallery-gauge="ok"><figure class="k-gauge" data-emphasis="standard"><figcaption class="k-gauge-head"><span class="k-gauge-label">示例比率</span><span class="k-gauge-value">72.00%</span>偏热</figcaption><div class="k-gauge-track" aria-hidden="true"><span class="k-gauge-fill" style="width:72%"></span></div><p class="k-gauge-note">示例：甲数 / (甲数 + 乙数)</p></figure></div></div><div class="gal-row"><span class="gal-cap">取不到</span><div class="gal-wide" data-gallery-gauge="missing"><figure class="k-gauge" data-emphasis="standard"><figcaption class="k-gauge-head"><span class="k-gauge-label">示例比率</span><span class="k-gauge-value is-unavailable">还没有数据</span></figcaption><div class="k-gauge-track" aria-hidden="true"></div></figure></div></div><div class="gal-row"><span class="gal-cap">分段占比（涨 · 平 · 跌）</span><div class="gal-wide" data-gallery-gauge="segments"><figure class="k-gauge" data-emphasis="standard"><figcaption class="k-gauge-head"><span class="k-gauge-label">示例涨跌家数</span><span class="k-gauge-value">5000</span></figcaption><div class="k-gauge-track" data-segmented="" aria-hidden="true"><span class="k-gauge-seg" data-tone="up" style="flex-grow:2310"></span><span class="k-gauge-seg" data-tone="muted" style="flex-grow:120"></span><span class="k-gauge-seg" data-tone="down" style="flex-grow:2570"></span></div><ul class="k-gauge-legend"><li data-tone="up">上涨 2310</li><li data-tone="muted">平 120</li><li data-tone="down">下跌 2570</li></ul></figure></div></div><div class="gal-row"><span class="gal-cap">分段占比（涨停 · 炸板 · 跌停）</span><div class="gal-wide" data-gallery-gauge="limits"><figure class="k-gauge" data-emphasis="standard"><figcaption class="k-gauge-head"><span class="k-gauge-label">示例涨停生态</span><span class="k-gauge-value">96</span></figcaption><div class="k-gauge-track" data-segmented="" aria-hidden="true"><span class="k-gauge-seg" data-tone="up" style="flex-grow:62"></span><span class="k-gauge-seg" data-tone="accent" style="flex-grow:24"></span><span class="k-gauge-seg" data-tone="down" style="flex-grow:10"></span></div><ul class="k-gauge-legend"><li data-tone="up">涨停 62</li><li data-tone="accent">炸板 24</li><li data-tone="down">跌停 10</li></ul></figure></div></div><p class="gal-note">示例数据，不是行情。share 越界按边画；null 不画填充；给了 segments 就按各段的量切开，不看 share。</p>

</body>
</html>
