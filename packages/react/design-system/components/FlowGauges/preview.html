<p class="gal-note">示例数据，不是行情。口径（怎么算）在调用方，这里只收算好的数。</p><div class="gal-row"><span class="gal-cap">四个仪表</span><div style="width:620px"><div class="k-flow" role="group" aria-label="订单流仪表"><section class="k-flow-cell-box" data-kind="pressure" aria-label="MARKET PRESSURE · 1m"><span class="k-flow-title">MARKET PRESSURE · 1m</span><span class="k-flow-value">+62</span><span class="k-flow-zero" role="meter" aria-label="MARKET PRESSURE · 1m" aria-valuemin="-100" aria-valuemax="100" aria-valuenow="62" aria-valuetext="+62"><i class="is-pos" style="left:50%;width:31%" aria-hidden="true"></i></span><span class="k-flow-note">买方 · 近 60s 逐笔</span></section><section class="k-flow-cell-box" data-kind="priceChange" aria-label="PRICE CHANGE · 5m"><span class="k-flow-title">PRICE CHANGE · 5m</span><span class="k-flow-value">−18</span><span class="k-flow-zero" role="meter" aria-label="PRICE CHANGE · 5m" aria-valuemin="-100" aria-valuemax="100" aria-valuenow="-18" aria-valuetext="−18"><i class="is-neg" style="left:41%;width:9%" aria-hidden="true"></i></span><span class="k-flow-note">−100 … +100</span></section><section class="k-flow-cell-box" data-kind="dom" aria-label="DOM PRESSURE · 10 档"><span class="k-flow-title">DOM PRESSURE · 10 档</span><span class="k-flow-depth" role="img" aria-label="前 10 档：买盘 71%，卖盘 29%"><i class="is-bid" style="height:60%"></i><i class="is-bid" style="height:80%"></i><i class="is-bid" style="height:100%"></i><i class="is-bid" style="height:70%"></i><i class="is-ask" style="height:40%"></i><i class="is-ask" style="height:30%"></i><i class="is-ask" style="height:50%"></i><i class="is-ask" style="height:20%"></i></span><span class="k-flow-note">Bid 71% · Ask 29%</span></section><section class="k-flow-cell-box" data-kind="divergence" aria-label="DELTA DIVERGENCE"><span class="k-flow-title">DELTA DIVERGENCE</span><span class="k-flow-matrix"><span class="k-flow-matrix-row" role="img" aria-label="5s: 近期两格同向，其余无背离"><span class="k-flow-window">5s</span><i class="k-flow-led is-off"></i><i class="k-flow-led is-off"></i><i class="k-flow-led is-ok"></i><i class="k-flow-led is-ok"></i><i class="k-flow-led is-on"></i><i class="k-flow-led is-on"></i></span><span class="k-flow-matrix-row" role="img" aria-label="1m: 末格背离预警"><span class="k-flow-window">1m</span><i class="k-flow-led is-off"></i><i class="k-flow-led is-ok"></i><i class="k-flow-led is-ok"></i><i class="k-flow-led is-ok"></i><i class="k-flow-led is-ok"></i><i class="k-flow-led is-warn"></i></span><span class="k-flow-matrix-row" role="img" aria-label="5m: 近三格同向"><span class="k-flow-window">5m</span><i class="k-flow-led is-off"></i><i class="k-flow-led is-off"></i><i class="k-flow-led is-off"></i><i class="k-flow-led is-ok"></i><i class="k-flow-led is-ok"></i><i class="k-flow-led is-ok"></i></span><span class="k-flow-matrix-row" role="img" aria-label="20m: 数据不足"><span class="k-flow-window">20m</span><span class="k-flow-na">N/A</span></span></span><span class="k-flow-note">20m · N/A（数据不足）</span></section></div></div></div><div class="gal-row"><span class="gal-cap">缺数据</span><div style="width:620px"><div class="k-flow" role="group" aria-label="订单流仪表（缺数据）"><section class="k-flow-cell-box" data-kind="pressure" aria-label="MARKET PRESSURE · 1m"><span class="k-flow-title">MARKET PRESSURE · 1m</span><span class="k-flow-value is-na">N/A</span><span class="k-flow-zero" role="meter" aria-label="MARKET PRESSURE · 1m" aria-valuemin="-100" aria-valuemax="100" aria-valuetext="N/A"></span><span class="k-flow-note">窗口不足</span></section><section class="k-flow-cell-box" data-kind="priceChange" data-estimated="true" aria-label="PRICE CHANGE · 5m"><span class="k-flow-title">PRICE CHANGE · 5m</span><span class="k-flow-value">+24<small class="k-flow-est">估算</small></span><span class="k-flow-zero" role="meter" aria-label="PRICE CHANGE · 5m" aria-valuemin="-100" aria-valuemax="100" aria-valuenow="24" aria-valuetext="+24"><i class="is-pos" style="left:50%;width:12%" aria-hidden="true"></i></span><span class="k-flow-note">无逐笔方向</span></section></div></div></div>
