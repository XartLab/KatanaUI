reshold" aria-label="阈值">60%</span></span><span class="k-rg-bar" aria-hidden="true"><i data-part="value" style="width:80%"></i><b data-part="threshold" style="left:64%"></b></span><span class="k-rg-state" data-state="pass" aria-label="结果"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-check" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>通过</span></li><li class="k-rg-row" data-slot="robustness-check" data-id="retention" data-state="fail" title="最优格周围八格的均值 ÷ 最优值"><span class="k-rg-name">最优参数邻域保留率</span><span class="k-rg-values"><span data-slot="robustness-value" aria-label="实测值">10%</span><span class="k-rg-op" aria-hidden="true">≥</span><span data-slot="robustness-threshold" aria-label="阈值">60%</span></span><span class="k-rg-bar" aria-hidden="true"><i data-part="value" style="width:13.418803418803419%"></i><b data-part="threshold" style="left:80%"></b></span><span class="k-rg-state" data-state="fail" aria-label="结果"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>未通过</span></li><li class="k-rg-row" data-slot="robustness-check" data-id="drawdown" data-state="pass"><span class="k-rg-name">样本外最大回撤</span><span class="k-rg-values"><span data-slot="robustness-value" aria-label="实测值">17%</span><span class="k-rg-op" aria-hidden="true">≤</span><span data-slot="robustness-threshold" aria-label="阈值">25%</span></span><span class="k-rg-bar" aria-hidden="true"><i data-part="value" style="width:53.44%"></i><b data-part="threshold" style="left:80%"></b></span><span class="k-rg-state" data-state="pass" aria-label="结果"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox
